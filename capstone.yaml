run: uvicorn main:app --host 0.0.0.0 --port 8000
seed: python seed.py
test: python -m pytest
base_url: http://localhost:8000
endpoints:
  - path: /api/auth/register
    method: POST
  - path: /api/auth/token
    method: POST
  - path: /api/widgets
    method: POST
  - path: /api/widgets
    method: GET
  - path: /api/submissions
    method: POST
  - path: /api/dashboard/submissions
    method: GET
  - path: /api/dashboard/analytics
    method: GET
